<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Şans Doygunluğu Problemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF9F5;
      --ink:#181C22;
      --ink-soft:#565B66;
      --brass:#B9924F;
      --brass-dim:#E7D9B8;
      --teal:#2C6863;
      --teal-dim:#DCE9E7;
      --rust:#A8462F;
      --rust-dim:#F0DAD3;
      --line:#DEDAD0;
      --card:#FFFFFF;
      --radius:14px;
      --shadow:0 1px 2px rgba(24,28,34,0.04), 0 8px 24px -12px rgba(24,28,34,0.18);
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:'Inter',system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }

    .wrap{
      max-width:520px;
      margin:0 auto;
      padding:28px 20px 60px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .eyebrow{
      font-size:12px;
      letter-spacing:0.14em;
      text-transform:uppercase;
      color:var(--brass);
      font-weight:600;
      margin-bottom:8px;
    }

    h1{
      font-family:'Fraunces',serif;
      font-weight:600;
      font-size:30px;
      line-height:1.15;
      margin:0 0 14px;
      letter-spacing:-0.01em;
    }

    h2{
      font-family:'Fraunces',serif;
      font-weight:600;
      font-size:22px;
      margin:0 0 10px;
    }

    p{
      font-size:15px;
      line-height:1.6;
      color:var(--ink-soft);
      margin:0 0 16px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px 22px;
      border:1px solid var(--line);
    }

    .stack{display:flex; flex-direction:column; gap:14px;}

    .btn{
      appearance:none;
      border:none;
      border-radius:10px;
      padding:15px 20px;
      font-family:inherit;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
      width:100%;
    }

    .btn:active{transform:scale(0.98);}
    .btn:disabled{opacity:.55; cursor:not-allowed; transform:none;}

    .btn-primary{background:var(--ink); color:var(--paper);}
    .btn-primary:hover:not(:disabled){opacity:0.88;}

    .btn-stop{background:var(--rust); color:#fff;}
    .btn-stop:hover:not(:disabled){opacity:0.9;}

    .btn-ghost{
      background:transparent;
      color:var(--ink-soft);
      border:1px solid var(--line);
    }
    .btn-ghost:hover:not(:disabled){background:#F2F0EA;}

    .field{display:flex; flex-direction:column; gap:6px;}
    .field label{font-size:13px; font-weight:600; color:var(--ink);}

    input[type=text]{
      font-family:inherit;
      font-size:15px;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      outline:none;
    }

    input[type=text]:focus{
      border-color:var(--teal);
      box-shadow:0 0 0 3px rgba(44,104,99,.10);
    }

    input.input-error{border-color:var(--rust);}

    .choice-row{display:flex; gap:8px; flex-wrap:wrap;}

    .choice{
      flex:1;
      min-width:80px;
      text-align:center;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid var(--line);
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      color:var(--ink-soft);
      background:#fff;
      user-select:none;
    }

    .choice.active{
      border-color:var(--teal);
      background:var(--teal-dim);
      color:var(--teal);
    }

    .choice-row.choice-error{
      padding:4px;
      margin:-4px;
      border:1px solid var(--rust);
      border-radius:12px;
    }

    .error-box{
      display:none;
      border-radius:10px;
      padding:12px 14px;
      background:var(--rust-dim);
      color:var(--rust);
      font-size:13px;
      line-height:1.45;
      font-weight:600;
    }
    .error-box.show{display:block;}

    .progress{display:flex; gap:5px; margin-bottom:22px;}
    .progress .dot{height:4px; flex:1; border-radius:2px; background:var(--line);}
    .progress .dot.done{background:var(--brass);}
    .progress .dot.current{background:var(--ink);}

    .ticket{
      position:relative;
      background:linear-gradient(180deg,#FFFFFF,#FCFAF5);
      border:1px solid var(--line);
      border-radius:12px;
      padding:0;
      overflow:hidden;
      margin-bottom:18px;
    }

    .ticket-tab{
      background:var(--ink);
      color:var(--paper);
      font-family:'Fraunces',serif;
      font-size:13px;
      letter-spacing:0.04em;
      padding:9px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .ticket-body{padding:26px 20px 22px; text-align:center;}

    .ticket-num{
      font-family:'Fraunces',serif;
      font-size:56px;
      font-weight:700;
      line-height:1;
      color:var(--ink);
    }

    .ticket-sub{font-size:13px; color:var(--ink-soft); margin-top:6px;}

    .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:14px;
      padding:7px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
    }

    .tag.best{background:var(--teal-dim); color:var(--teal);}
    .tag.notbest{background:#EFEDE7; color:var(--ink-soft);}


    .candidate-summary{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:18px;
      text-align:left;
    }

    .candidate-code{
      font-family:'Fraunces',serif;
      font-size:25px;
      font-weight:700;
      line-height:1.1;
      color:var(--ink);
    }

    .candidate-meta{
      margin-top:5px;
      color:var(--ink-soft);
      font-size:12px;
      line-height:1.45;
    }

    .candidate-position{
      min-width:48px;
      height:48px;
      border:1px solid var(--line);
      border-radius:12px;
      display:grid;
      place-items:center;
      font-family:'Fraunces',serif;
      font-size:21px;
      font-weight:700;
      background:#fff;
    }

    .competency-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:0 0 18px;
      text-align:left;
    }

    .competency-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size:12px;
      margin-bottom:5px;
    }

    .competency-name{font-weight:600; color:var(--ink);}
    .competency-value{font-weight:700; color:var(--ink-soft);}
    .competency-track{
      height:7px;
      border-radius:999px;
      background:#ECE9E1;
      overflow:hidden;
    }

    .competency-fill{
      height:100%;
      border-radius:inherit;
      background:var(--teal);
    }

    .story-card{
      text-align:left;
      background:#F4F1EA;
      border:1px solid #E4DED1;
      border-radius:10px;
      padding:14px 15px;
    }

    .story-label{
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:700;
      color:#7A5D24;
      margin-bottom:6px;
    }

    .story-card p{
      font-size:13px;
      line-height:1.55;
      margin:0;
      color:var(--ink-soft);
    }

    .profile-comparison{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:14px 0 18px;
    }

    .profile-score-box{
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
      background:#fff;
      text-align:center;
    }

    .profile-score-box span{
      display:block;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--ink-soft);
      margin-bottom:4px;
    }

    .profile-score-box strong{
      font-family:'Fraunces',serif;
      font-size:22px;
    }

    .actions{display:flex; flex-direction:column; gap:10px;}

    .note-forced{
      font-size:13px;
      color:var(--rust);
      text-align:center;
      font-weight:600;
      margin-bottom:10px;
    }

    .result-badge{
      text-align:center;
      padding:26px 20px;
      border-radius:12px;
      margin-bottom:16px;
    }

    .result-badge.win{background:var(--teal-dim);}
    .result-badge.lose{background:var(--rust-dim);}

    .result-badge .big{
      font-family:'Fraunces',serif;
      font-size:20px;
      font-weight:600;
      margin-bottom:4px;
    }

    .win .big{color:var(--teal);}
    .lose .big{color:var(--rust);}

    .n-badge{
      display:inline-block;
      background:var(--brass-dim);
      color:#7A5D24;
      font-weight:700;
      font-size:12px;
      padding:3px 9px;
      border-radius:6px;
      margin-bottom:8px;
    }

    .save-icon{
      width:54px;
      height:54px;
      margin:4px auto 16px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:25px;
      background:var(--teal-dim);
      color:var(--teal);
    }

    .save-icon.loading{
      background:var(--brass-dim);
      color:#7A5D24;
      animation:pulse 1.1s ease-in-out infinite;
    }

    .save-icon.error{background:var(--rust-dim); color:var(--rust); animation:none;}

    .save-detail{
      font-size:13px;
      text-align:center;
      color:var(--ink-soft);
      margin-top:10px;
    }

    .fallback-link{
      display:block;
      text-align:center;
      margin-top:14px;
      color:var(--ink-soft);
      font-size:13px;
    }

    @keyframes pulse{
      0%,100%{transform:scale(1); opacity:.7;}
      50%{transform:scale(1.06); opacity:1;}
    }
  </style>
</head>

    function createSessionId(){
      if(window.crypto && typeof window.crypto.randomUUID === 'function'){
        return window.crypto.randomUUID();
      }
      return `sd-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
    }

    function shuffle(arr,rng=Math.random){
      for(let i=arr.length-1; i>0; i--){
        const j = Math.floor(rng() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function mulberry32(seed){
      let value=seed>>>0;
      return function(){
        value+=0x6D2B79F5;
        let t=value;
        t=Math.imul(t^(t>>>15),t|1);
        t^=t+Math.imul(t^(t>>>7),t|61);
        return ((t^(t>>>14))>>>0)/4294967296;
      };
    }

    function clamp(value,min,max){
      return Math.max(min,Math.min(max,value));
    }

    function randomCentered(rng=Math.random){
      return rng()+rng()+rng()-1.5;
    }

    function scoreBand(score){
      if(score>=86) return 'exceptional';
      if(score>=77) return 'strong';
      if(score>=68) return 'solid';
      if(score>=59) return 'developing';
      return 'early';
    }

    function strongestCompetencyKey(profile){
      return COMPETENCIES
        .map(item=>({key:item.key,score:profile.competencyScores[item.key]}))
        .sort((a,b)=>b.score-a.score)[0].key;
    }

    function candidateStoryLevel(profile,isBest){
      if(isBest || profile.overallScore>=84) return 'strong';
      if(profile.overallScore>=66) return 'solid';
      return 'developing';
    }

    function fillStoryTemplate(text,profile){
      return text.replaceAll('{years}',String(profile.experienceYears));
    }

    function selectStoryTemplate(profile,availableTemplates){
      const strongest=strongestCompetencyKey(profile);
      let index=availableTemplates.findIndex(item=>item.primary===strongest);
      if(index<0) index=0;
      return availableTemplates.splice(index,1)[0];
    }

    function createCandidateStory(profile,template,isBest){
      const level=candidateStoryLevel(profile,isBest);
      const intro=fillStoryTemplate(template.intro,profile);
      const detail=fillStoryTemplate(template[level],profile);
      return `${intro} ${detail}`;
    }

    function createCandidateProfile(position,trialSize,rng=Math.random){
      const base=48+rng()*43;
      const standoutIndex=Math.floor(rng()*COMPETENCIES.length);
      let developmentIndex=Math.floor(rng()*COMPETENCIES.length);
      while(developmentIndex===standoutIndex){
        developmentIndex=Math.floor(rng()*COMPETENCIES.length);
      }

      const competencyScores={};
      COMPETENCIES.forEach((item,index)=>{
        let modifier=randomCentered(rng)*14;
        if(index===standoutIndex) modifier+=7;
        if(index===developmentIndex) modifier-=7;
        competencyScores[item.key]=clamp(Math.round(base+modifier),38,98);
      });

      const overallScore=COMPETENCIES.reduce(
        (sum,item)=>sum+competencyScores[item.key]*item.weight,
        0
      );

      const experienceYears=clamp(
        Math.round(1+(overallScore-45)/8+randomCentered(rng)),
        1,
        8
      );

      return {
        id:String(position+1).padStart(2,'0'),
        experienceYears,
        competencyScores,
        overallScore:Number(overallScore.toFixed(4)),
        storyline:''
      };
    }


    function buildStandardPools(){
      const rng=mulberry32(22092026);
      const availableTemplates=shuffle(CANDIDATE_STORIES.slice(),rng);
      const pools={};

      N_VALUES.forEach(n=>{
        let profiles;
        let values;
        let bestIndex;

        do {
          profiles=Array.from({length:n},(_,index)=>createCandidateProfile(index,n,rng));
          values=profiles.map(profile=>profile.overallScore);
          const maxScore=Math.max(...values);
          const topIndexes=values
            .map((value,index)=>value===maxScore?index:-1)
            .filter(index=>index!==-1);
          bestIndex=topIndexes.length===1?topIndexes[0]:-1;
        } while(bestIndex===-1);

        profiles.forEach((profile,index)=>{
          const template=selectStoryTemplate(profile,availableTemplates);
          profile.poolId=`n${n}-${String(index+1).padStart(2,'0')}`;
          profile.storyTemplate=template.id;
          profile.storyline=createCandidateStory(profile,template,index===bestIndex);
        });

        pools[n]=profiles;
      });

      return pools;
    }

    const STANDARD_POOLS=buildStandardPools();
    const POOL_VERSION='2026-08-v1';

    function cloneProfile(profile){
      return {
        ...profile,
        competencyScores:{...profile.competencyScores}
      };
    }

    function renderCompetencies(profile){
      return COMPETENCIES.map(item=>{
        const score=profile.competencyScores[item.key];
        return `
          <div class="competency-item">
            <div class="competency-head">
              <span class="competency-name">${item.label}</span>
              <span class="competency-value">${score}/100</span>
            </div>
            <div class="competency-track" aria-label="${item.label}: ${score} üzerinden 100">
              <div class="competency-fill" style="width:${score}%"></div>
            </div>
          </div>`;
      }).join('');
    }

    function newTrial(n){
      const profiles=shuffle(
        STANDARD_POOLS[n].map(cloneProfile),
        Math.random
      ).map((profile,index)=>({
        ...profile,
        id:String(index+1).padStart(2,'0')
      }));

      const values=profiles.map(profile=>profile.overallScore);
      const bestIndex=values.indexOf(Math.max(...values));

      return {
        n,
        profiles,
        values,
        bestIndex,
        pos:0,
        seenMax:-Infinity,
        startedAt:Date.now(),
        actions:[]
      };
    }

        n5dur:byN[5] ? String(byN[5].stopPosition) : '',
        n5iyi:byN[5] ? (byN[5].success ? 'Evet' : 'Hayır') : '',
        n12dur:byN[12] ? String(byN[12].stopPosition) : '',
        n12iyi:byN[12] ? (byN[12].success ? 'Evet' : 'Hayır') : '',
        n20dur:byN[20] ? String(byN[20].stopPosition) : '',
        n20iyi:byN[20] ? (byN[20].success ? 'Evet' : 'Hayır') : '',
        detay:JSON.stringify(buildDetailedPayload())
      });
    }

    function submitResults(){
      if(state.saveStatus === 'saving' || state.saveStatus === 'success') return;

      if(!GOOGLE_APPS_SCRIPT_URL || !GOOGLE_APPS_SCRIPT_URL.includes('/exec')){
        state.saveStatus='error';
        state.saveError='Otomatik gönderim bağlantısı henüz ayarlanmadı.';
        render();
        return;
      }

      if(!navigator.onLine){
        state.saveStatus='error';
        state.saveError='İnternet bağlantısı görünmüyor.';
        render();
        return;
      }

      state.saveStatus='saving';
      state.saveError='';
      render();

      const requestStartedAt=Date.now();

      fetch(GOOGLE_APPS_SCRIPT_URL,{
        method:'POST',
        mode:'no-cors',
        credentials:'omit',
        body:buildPostParams()
      }).catch(()=>{
        // CORS nedeniyle yanıt okunamaz. Gerçek kayıt durumu aşağıdaki
        // kısa JSONP isteğiyle ayrıca doğrulanır.
      });

      window.setTimeout(()=>pollSaveStatus(requestStartedAt),900);
    }

    function pollSaveStatus(requestStartedAt){
      if(state.saveStatus !== 'saving') return;

      const callbackName=`__sdStatus_${state.sessionId.replace(/[^a-zA-Z0-9_$]/g,'')}_${Date.now()}`;
      const script=document.createElement('script');
      let settled=false;
      let requestTimeout;

      function cleanup(){
        window.clearTimeout(requestTimeout);
        script.remove();
        try{delete window[callbackName];}catch(error){window[callbackName]=undefined;}
      }

      function retry(){
        cleanup();
        if(Date.now()-requestStartedAt>=60000){
          state.saveStatus='error';
          state.saveError='Google Form zamanında yanıt vermedi. Lütfen tekrar dene.';
          render();
          return;
        }
        window.setTimeout(()=>pollSaveStatus(requestStartedAt),1200);
      }

      window[callbackName]=(result)=>{
        if(settled) return;
        settled=true;

        if(result && result.saved===true){
          cleanup();
          state.saveStatus='success';
          state.saveError='';
          render();
          return;
        }

        if(result && result.error){
          cleanup();
          state.saveStatus='error';
          state.saveError=String(result.error);
          render();
          return;
        }

        retry();
      };

      script.async=true;
      script.src=`${GOOGLE_APPS_SCRIPT_URL}?action=status&token=${encodeURIComponent(state.sessionId)}&callback=${encodeURIComponent(callbackName)}&_=${Date.now()}`;
      script.onerror=()=>{
        if(settled) return;
        settled=true;
        retry();
      };

      requestTimeout=window.setTimeout(()=>{
        if(settled) return;
        settled=true;
        retry();
      },8000);

      document.head.appendChild(script);
    }

    const screens={};

    screens.welcome=function(){
      const wrap=el(`
        <div>
          <div class="eyebrow">Ankara Üniversitesi · İstatistik Araştırması</div>
          <h1>Şans Doygunluğu Problemi</h1>
          <div class="card stack">
            <p style="margin-bottom:0">Sana sırayla anonim iş adayları gösterilecek. Her adayın disiplin, iletişim, uyum ve öğrenme ile analitik düşünme puanlarını; deneyim süresini ve adayın kendi ağzından kısa tanıtımını göreceksin. Her adayda “geç” ya da “bu adayı seç ve dur” diyeceksin — durduğunda geri dönemiyorsun. Amaç, karşına çıkanlar arasından <b>en iyisini</b> yakalamak.</p>
          </div>
          <div style="height:14px"></div>
          <div class="card stack">
            <p style="margin-bottom:0;font-size:13px">Kimlik bilgisi toplanmıyor. Cevapların bir istatistik araştırmasında anonim olarak kullanılacak.</p>
          </div>
          <div style="height:20px"></div>
          <button class="btn btn-primary" id="start">Başla</button>
        </div>
      `);

      wrap.querySelector('#start').onclick=()=>{
        state.startedAt=Date.now();
        state.screen='demo';
        render();
      };
      return wrap;
    };

    screens.demo=function(){
      const wrap=el(`
        <div>
          ${progressBar(0,TOTAL_SCREENS)}
          <h2>Birkaç kısa soru</h2>
          <p>Sonuçları yorumlarken işimize yarayacak.</p>
          <div class="card stack">
            <div class="field">
              <label for="bolum">Bölümün</label>
              <input type="text" id="bolum" maxlength="80" autocomplete="organization-title" placeholder="ör. İstatistik" value="${escapeHtml(state.demo.bolum)}">
            </div>
            <div class="field">
              <label>Kaçıncı sınıf</label>
              <div class="choice-row" id="sinifRow">
                ${['1','2','3','4','Mezun'].map(s=>`<div class="choice ${state.demo.sinif===s?'active':''}" data-v="${s}" role="button" tabindex="0">${s}</div>`).join('')}
              </div>
            </div>
            <div class="field">
              <label>Olasılık/istatistik dersi aldın mı?</label>
              <div class="choice-row" id="dersRow">
                ${['Evet','Hayır'].map(s=>`<div class="choice ${state.demo.ders===s?'active':''}" data-v="${s}" role="button" tabindex="0">${s}</div>`).join('')}
              </div>
            </div>
            <div class="error-box" id="demoError" aria-live="polite"></div>
          </div>
          <div style="height:20px"></div>
          <button class="btn btn-primary" id="next">Devam Et</button>
        </div>
      `);

      const input=wrap.querySelector('#bolum');
      input.oninput=e=>{state.demo.bolum=e.target.value;};

      function bindChoices(selector,key){
        wrap.querySelectorAll(selector).forEach(choice=>{
          const select=()=>{
            state.demo[key]=choice.dataset.v;
            render();
          };
          choice.onclick=select;
          choice.onkeydown=e=>{
            if(e.key==='Enter' || e.key===' '){e.preventDefault(); select();}
          };
        });
      }

      bindChoices('#sinifRow .choice','sinif');
      bindChoices('#dersRow .choice','ders');

      wrap.querySelector('#next').onclick=()=>{
        const errors=validateDemo();
        if(errors.length){
          input.value=state.demo.bolum;
          input.classList.toggle('input-error',state.demo.bolum.length<2);
          wrap.querySelector('#sinifRow').classList.toggle('choice-error',!state.demo.sinif);
          wrap.querySelector('#dersRow').classList.toggle('choice-error',!state.demo.ders);
          const errorBox=wrap.querySelector('#demoError');
          errorBox.textContent=errors.join(' ');
          errorBox.classList.add('show');
          return;
        }
        state.screen='instructions';
        render();
      };

      return wrap;
    };

    screens.instructions=function(){
      const wrap=el(`
        <div>
          ${progressBar(1,TOTAL_SCREENS)}
          <h2>Kurallar</h2>
          <div class="card stack">
            <p style="margin-bottom:0">• Adaylar sırayla ve tek tek gösterilecek; her adayın yetkinlikleri ile kendi ağzından yaptığı kısa tanıtım birlikte değerlendirilecek.</p>
            <p style="margin-bottom:0">• Her adayda, birleşik değerlendirmeye göre o ana kadar gördüklerin arasında <b>en iyisi olup olmadığını</b> göreceksin; sırada kimin olduğunu bilemeyeceksin.</p>
            <p style="margin-bottom:0">• “Geç” dersen bir daha o adaya dönemezsin.</p>
            <p style="margin-bottom:0">• “Bu adayı seç ve dur” dersen tur biter. Sonuçları üç tur tamamlandıktan sonra görürsün.</p>
          </div>
          <div style="height:20px"></div>
          <button class="btn btn-primary" id="go">Anladım, başlayalım</button>
        </div>
      `);

      wrap.querySelector('#go').onclick=()=>{
        state.trial=newTrial(state.order[0]);
        state.screen='trial';
        render();
      };
      return wrap;
    };

    screens.trial=function(){
      const t=state.trial;
      const idx=t.pos;
      const val=t.values[idx];
      const profile=t.profiles[idx];
      const isBest=val>t.seenMax;
      const isLast=idx===t.n-1;

      const wrap=el(`
        <div>
          ${progressBar(2+state.trialIndex,TOTAL_SCREENS)}
          <div class="n-badge">Tur ${state.trialIndex+1} / ${N_VALUES.length} · n = ${t.n}</div>
          <div class="ticket">
            <div class="ticket-tab">
              <span>ADAY DOSYASI</span>
              <span>${idx+1} / ${t.n}</span>
            </div>
            <div class="ticket-body">
              <div class="candidate-summary">
                <div>
                  <div class="candidate-code">Aday ${profile.id}</div>
                  <div class="candidate-meta">${profile.experienceYears} yıl deneyim · anonim profil</div>
                </div>
                <div class="candidate-position">${idx+1}</div>
              </div>
              <div class="competency-list">${renderCompetencies(profile)}</div>
              <div class="story-card">
                <div class="story-label">Adayın kısa anlatımı</div>
                <p>${profile.storyline}</p>
              </div>
              <div class="tag ${isBest?'best':'notbest'}">${isBest?'★ Şimdiye kadarkilerin en iyisi':'Şimdiye kadarkilerin en iyisi değil'}</div>
            </div>
          </div>
          ${isLast?'<div class="note-forced">Bu son aday — birini seçmek zorundasın.</div>':''}
          <div class="actions">
            ${!isLast?'<button class="btn btn-ghost" id="pass">Geç, sıradakine bak →</button>':''}
            <button class="btn btn-stop" id="stop">${isLast?'Bu Adayı Seç (Son Şansın)':'Bu Adayı Seç ve Dur'}</button>
          </div>
        </div>
      `);

      if(!isLast){
        wrap.querySelector('#pass').onclick=()=>{
          t.actions.push({
            position:idx+1,
            decision:'pass',
            runningBest:isBest,
            elapsedMs:Date.now()-t.startedAt
          });
          t.seenMax=Math.max(t.seenMax,val);
          t.pos+=1;
          render();
        };
      }

      wrap.querySelector('#stop').onclick=()=>{
        const success=idx===t.bestIndex;
        t.actions.push({
          position:idx+1,
          decision:'stop',
          runningBest:isBest,
          elapsedMs:Date.now()-t.startedAt
        });

        state.trialResults.push({
          n:t.n,
          stopPosition:idx+1,
          success,
          trueBestPosition:t.bestIndex+1,
          selectedScore:Number(t.profiles[idx].overallScore.toFixed(1)),
          bestScore:Number(t.profiles[t.bestIndex].overallScore.toFixed(1)),
          trialDurationMs:Date.now()-t.startedAt,
          values:roundedValues(t.values),
          profileOrder:t.profiles.map(profile=>profile.poolId),
          selectedWasRunningBest:isBest,
          passedRunningBestCount:t.actions.filter(action=>
            action.decision==='pass' && action.runningBest
          ).length,
          runningBestPositions:t.values
            .map((_,i)=>isRunningBest(t.values,i)?i+1:null)
            .filter(Boolean),
          actions:t.actions.slice()
        });

        const isLastTrial=state.trialIndex===N_VALUES.length-1;
        if(isLastTrial){
          state.screen='done';
          state.saveStatus='idle';
          render();
          submitResults();
        }else{
          state.screen='betweenTrials';
          render();
        }
      };

      return wrap;
    };

    screens.betweenTrials=function(){
      const completed=state.trialIndex+1;
      const wrap=el(`
        <div>
          ${progressBar(2+state.trialIndex,TOTAL_SCREENS)}
          <div class="eyebrow">Tur ${completed} / ${N_VALUES.length}</div>
          <h1>Tur tamamlandı</h1>
          <div class="card">
            <p style="text-align:center;margin-bottom:0">Sonuçlar deneyin sonunda gösterilecek.</p>
          </div>
          <div style="height:20px"></div>
          <button class="btn btn-primary" id="cont">Sıradaki Tura Geç</button>
        </div>
      `);

      wrap.querySelector('#cont').onclick=()=>{
        state.trialIndex+=1;
        state.trial=newTrial(state.order[state.trialIndex]);
        state.screen='trial';
        render();
      };

      return wrap;
    };

    screens.done=function(){
      const status=state.saveStatus;
      let icon='✓';
      let iconClass='';
      let title='Cevapların gönderildi';
      let message='Teşekkürler. Google Form yanıtının ve davranış verilerinin kaydedildiği doğrulandı.';

      if(status==='idle' || status==='saving'){
        icon='…';
        iconClass='loading';
        title='Cevapların kaydediliyor';
        message='Bu sayfayı kapatmadan birkaç saniye bekle.';
      }else if(status==='error'){
        icon='!';
        iconClass='error';
        title='Otomatik gönderim tamamlanamadı';
        message=`${escapeHtml(state.saveError)} Yanıtların henüz tamamen kaydedilmedi.`;
      }

      const resultRows=state.trialResults
        .slice()
        .sort((a,b)=>a.n-b.n)
        .map(r=>`
          <div class="profile-score-box">
            <span>${r.n} adaylık tur</span>
            <strong style="font-size:17px">${r.success?'Başarılı':'Başarısız'}</strong>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:5px">
              ${r.stopPosition}. sırada durdun · En iyi ${r.trueBestPosition}. sıradaydı
            </div>
          </div>`).join('');

      const wrap=el(`
        <div>
          <div class="eyebrow">Araştırma tamamlandı</div>
          <h1>${title}</h1>
          <div class="card">
            <div class="save-icon ${iconClass}">${icon}</div>
            <p style="text-align:center;margin-bottom:0">${message}</p>
            ${status==='error'
              ? '<div style="height:16px"></div><button class="btn btn-primary" id="retry">Tekrar Dene</button>'
              : ''}
          </div>
          <div style="height:18px"></div>
          <h2>Deney sonuçların</h2>
          <div class="stack">${resultRows}</div>
          ${status==='error'
            ? `<a class="fallback-link" href="${buildPrefilledUrl()}" target="_blank" rel="noopener">Formu elle aç</a>`
            : ''}
        </div>
      `);

      const retry=wrap.querySelector('#retry');
      if(retry) retry.onclick=submitResults;
      return wrap;
    };

    render();
  })();
  </script>
</body>
